      - python
      - node
      - java
      - go
      - rust
      - php
      - csharp
      - cpp
      - ruby

  - id: containers
    name: Containers
    selection: multiple
    options:
      - docker
      - podman
      - distrobox
      - toolbox

  - id: virtualization
    name: Virtualization
    selection: multiple
    options:
      - qemu-kvm
      - virtualbox
      - vmware-tools

  - id: drivers
    name: Drivers
    selection: single
    options:
      - auto-detect
      - nvidia-proprietary
      - nvidia-open
      - amd
      - intel

  - id: kernels
    name: Kernel
    selection: multiple
    options:
      - linux
      - linux-lts
      - linux-zen
      - linux-hardened

  - id: filesystems
    name: Filesystem
    selection: single
    options:
      - btrfs
      - ext4
      - xfs

  - id: snapshots
    name: Snapshots
    selection: multiple
    options:
      - snapper
      - timeshift

  - id: shells
    name: Shell
    selection: single
    options:
      - bash
      - zsh
      - fish

  - id: terminals
    name: Terminal
    selection: single
    options:
      - konsole
      - kitty
      - alacritty
      - ghostty
      - gnome-terminal
      - xfce4-terminal
      - mate-terminal
      - qterminal

  - id: editors
    name: Editor
    selection: single
    options:
      - kate
      - code
      - neovim
      - emacs
      - gnome-text-editor
      - pluma
      - featherpad
      - mousepad
      - pantheon-text-editor

  - id: themes
    name: Theme
    selection: single
    options:
      - gnegnolios-dark
      - gnegnolios-crimson
      - gnegnolios-steel

  - id: optional_services
    name: Optional Services
    selection: multiple
    options:
      - bluetooth
      - cups
      - avahi
      - samba
      - openssh
      - tailscale
      - syncthing
      - kde-connect

  - id: privacy
    name: Privacy And Security
    selection: multiple
    options:
      - ufw
      - fail2ban
      - dns-over-https
      - flatpak-sandbox
      - firejail
      - apparmor

  - id: extra_tools
    name: Extra Tools
    selection: multiple
    options:
      - gparted
      - bleachbit
      - filezilla
      - krita
      - inkscape
      - obs
      - steam
      - bottles
      - heroic

profiles:
  home:
    name: Home
    description: Daily desktop use with browser, file tools, screenshots, power management, and archive tools.
    packages:
      pacman:
        - firefox
        - __FILE_MANAGER__
        - ark
        - __SCREENSHOT__
        - partitionmanager
        - power-profiles-daemon

  office:
    name: Office
    description: Documents, PDF, printing, dictionaries, and scanning-ready foundations.
    packages:
      pacman:
        - libreoffice-fresh
        - okular
        - hunspell
        - hunspell-en_us
        - cups
        - system-config-printer
      aur:
        - onlyoffice-bin

  gaming:
    name: Gaming
    description: Steam, Wine, launchers, overlays, and capture tools.
    packages:
      pacman:
        - steam
        - lutris
        - wine
        - winetricks
        - gamemode
        - mangohud
        - obs-studio
        - discord
      flatpak:
        - com.heroicgameslauncher.hgl
        - com.usebottles.bottles
      aur:
        - proton-ge-custom-bin

  streaming:
    name: Streaming
    description: Recording, live streaming, chat, encoding, and media conversion.
    packages:
      pacman:
        - obs-studio
        - ffmpeg
        - handbrake
        - discord

  development:
    name: Development
    description: IDEs, languages, containers, version control, and database clients.
    packages:
      pacman:
        - base-devel
        - git
        - github-cli
        - code
        - neovim
        - docker
        - docker-compose
        - podman
        - distrobox
        - nodejs
        - npm
        - python
        - python-pip
        - jdk-openjdk
        - rust
        - go
        - php
        - composer
        - mariadb-clients
        - postgresql-libs

  containers:
    name: Containers
    description: Docker, Podman, Distrobox, and Toolbox for development and isolated workloads.
    packages:
      pacman:
        - docker
        - docker-compose
        - podman
        - distrobox
        - toolbox

  music-production:
    name: Music Production
    description: DAW, patchbay, JACK compatibility, audio effects, and plugin hosts.
    packages:
      pacman:
        - ardour
        - audacity
        - carla
        - helvum
        - easyeffects
        - qjackctl
        - pipewire-jack
        - lsp-plugins
        - calf
      aur:
        - reaper-bin

  graphic-design:
    name: Graphic Design
    description: Raster, vector, and painting tools.
    packages:
      pacman:
        - gimp
        - krita
        - inkscape

  video-editing:
    name: Video Editing
    description: Non-linear editors, encoding, screen capture, and 3D motion work.
    packages:
      pacman:
        - kdenlive
        - shotcut
        - obs-studio
        - ffmpeg
        - handbrake
        - blender
      manual:
        - davinci-resolve

  photography:
    name: Photography
    description: RAW processing, image management, and retouching.
    packages:
      pacman:
        - darktable
        - rawtherapee
        - digikam
        - gimp

  3d-modeling:
    name: 3D Modeling
    description: Blender and CAD-adjacent modeling tools.
    packages:
      pacman:
        - blender
        - freecad

  cad:
    name: CAD
    description: 2D and parametric CAD tools.
    packages:
      pacman:
        - freecad
        - librecad

  cybersecurity:
    name: Cybersecurity
    description: Network inspection, packet capture, VPN, and firewall tools.
    packages:
      pacman:
        - nmap
        - wireshark-qt
        - tcpdump
        - openvpn
        - wireguard-tools

  virtualization:
    name: Virtualization
    description: QEMU/KVM, libvirt UI, firmware, and network support.
    packages:
      pacman:
        - qemu-full
        - virt-manager
        - dnsmasq
        - edk2-ovmf

  server:
    name: Server
    description: SSH, web, database, cache, firewall, and intrusion prevention basics.
    packages:
      pacman:
        - openssh
        - nginx
        - mariadb
        - postgresql
        - valkey
        - fail2ban
        - ufw

  ai-machine-learning:
    name: AI And Machine Learning
    description: Python notebooks, local models, and ML frameworks.
    packages:
      pacman:
        - python
        - python-pip
        - jupyter-notebook
        - python-pytorch
        - python-tensorflow
        - ollama
      hardware_optional:
        nvidia:
          - cuda
        amd:
          - rocm-hip-sdk

  multimedia:
    name: Multimedia
    description: Players, codecs, conversion, and light creative tooling.
    packages:
      pacman:
        - vlc
        - mpv
        - celluloid
        - ffmpeg
        - handbrake
        - gimp

  security-privacy:
    name: Security And Privacy
    description: Firewall, sandboxing, application confinement, and intrusion prevention.
    packages:
      pacman:
        - ufw
        - fail2ban
        - firejail
        - apparmor

