# ==========================================================
# GnegnoliOS Smart Installer Catalog
# ==========================================================

version: 1

philosophy:
  statement: Install only what you need. Everything works. Nothing is missing.
  goals:
    - Keep Express mode simple enough for first-time Linux users.
    - Make Guided mode the recommended path for most users.
    - Give Advanced users granular control without hiding power.
    - Avoid installing unused heavy software unless the user asks for it.

runtime:
  framework: calamares
  strategy: custom catalog consumed by Calamares pages or custom modules
  package_manager: pacman
  aur_helper: yay
  flatpak: enabled
  notes:
    - Calamares itself must be supplied by a custom repository or AUR bootstrap package.
    - AUR, Flatpak, and manual installers are intentionally separated from pacman packages.
    - Steam and Wine require the multilib repository.

defaults:
  mode: guided
  browser: firefox
  office_suite: libreoffice
  kernel: linux
  filesystem: btrfs
  snapshots: snapper
  shell: bash
  terminal: konsole
  editor: kate
  theme: gnegnolios-dark
  driver: auto-detect

modes:
  - id: express
    name: Express Installation
    description: Installs a complete ready-to-use KDE system with no optional questions.
    include_profiles:
      - home
      - office
      - multimedia
      - gaming
      - security-privacy
    fixed_choices:
      browser: firefox
      office_suite: libreoffice
      kernel: linux
      filesystem: btrfs
      snapshots: snapper
      shell: bash
      terminal: konsole
      editor: kate
      theme: gnegnolios-dark
      driver: auto-detect

  - id: guided
    name: Guided Installation
    description: Recommended mode with smart profiles and expandable package categories.
    categories:
      - usage_profiles
      - browsers
      - office_suites
      - multimedia
      - development_languages
      - containers
      - virtualization
      - snapshots
      - shells
      - terminals
      - editors
      - themes
      - optional_services
      - privacy
      - extra_tools

  - id: advanced
    name: Advanced Installation
    description: Full control over filesystem, kernels, bootloader, services, profiles, and packages.
    unlocks:
      - multi_kernel_install
      - bootloader_selection
      - service_selection
      - filesystem_selection
      - package_source_selection
      - post_install_hooks

ui:
  pattern: expandable-category-cards
  summary_required: true
  beginner_path: one-click profiles
  advanced_path: per-package overrides
  category_card_fields:
    - name
    - description
    - package_count
    - recommended
    - source_mix

categories:
  - id: usage_profiles
    name: PC Usage
    selection: multiple
    options:
