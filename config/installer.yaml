      - office
      - gaming
      - streaming
      - development
      - music-production
      - graphic-design
      - video-editing
      - photography
      - 3d-modeling
      - cad
      - cybersecurity
      - virtualization
      - server
      - ai-machine-learning

  - id: browsers
    name: Browser
    selection: single
    options:
      - firefox
      - brave
      - chromium
      - vivaldi
      - none

  - id: office_suites
    name: Office Suite
    selection: single
    options:
      - libreoffice
      - onlyoffice
      - both
      - none

  - id: multimedia
    name: Multimedia
    selection: multiple
    options:
      - vlc
      - mpv
      - celluloid
      - spotify
      - jellyfin
      - kodi

  - id: development_languages
