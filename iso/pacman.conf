# pacman.conf used only while building the ISO (mkarchiso).
# The installed system gets airootfs/etc/pacman.conf instead.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# AUR packages built by build.sh; @AUR_REPO@ is replaced at build time.
[gnegnolios-aur]
SigLevel = Optional TrustAll
Server = file://@AUR_REPO@

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
