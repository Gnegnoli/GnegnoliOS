# ==========================================================
# GnegnoliOS Calamares Settings
# ==========================================================

---
modules-search:
  - local

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary

  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - initcpio
      - grubcfg
      - bootloader
      - umount

  - show:
      - finished

branding: gnegnolios

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
