# ==========================================================
# GnegnoliOS Calamares Package Backend
# ==========================================================

---
backend: pacman

skip_if_no_internet: false
update_db: true
update_system: false

pacman:
  num_retries: 2
  disable_download_timeout: true
  needed_only: true

# The future Smart Installer module should resolve
# /usr/share/gnegnolios/installer/catalog.yaml and populate Calamares'
# packageOperations storage before this module runs.
operations:
  - install:
      - mesa
