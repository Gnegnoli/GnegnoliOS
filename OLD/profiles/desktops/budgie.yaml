  - budgie-desktop
  - budgie-desktop-view
  - lightdm
  - lightdm-gtk-greeter

display_manager:
  package: lightdm
  service: lightdm

session: budgie-desktop

defaults:
  terminal: gnome-terminal
  file_manager: nautilus
