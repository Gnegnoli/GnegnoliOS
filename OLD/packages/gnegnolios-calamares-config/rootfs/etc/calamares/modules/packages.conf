# ==========================================================
# GnegnoliOS Calamares Package Backend
# ==========================================================

---
backend: pacman

skip_if_no_internet: false
update_db: true
update_system: false

pacman:
  num_retries: 2
  disable_download_timeout: true
  needed_only: true

# Static baseline installed on every mode/path: generic mesa (Guided/Advanced
# rely on the packagechooser drivers page for anything vendor-specific;
# Express adds mesa itself in its own generated packages-express.conf), plus
# filesystem tooling for the non-default filesystem choices (btrfs-progs is
# already guaranteed via profiles/base.yaml).
operations:
  - install:
      - mesa
      - e2fsprogs
      - xfsprogs
