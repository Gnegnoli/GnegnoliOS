LABEL arch_nbd
TEXT HELP
Boot the GnegnoliOS live installer using NBD.
It allows you to install GnegnoliOS or perform system maintenance.
ENDTEXT
MENU LABEL GnegnoliOS live installer (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y console=ttyS0,115200n8 console=tty0
SYSAPPEND 3

